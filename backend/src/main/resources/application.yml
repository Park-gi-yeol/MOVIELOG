server:
  port: 8000

spring:
  application:
    name: movielog-backend


  datasource:
    url: jdbc:postgresql://localhost:5432/movielog
    username: movielog
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

